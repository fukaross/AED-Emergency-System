components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminSessionKey:
      type: apiKey
      in: header
      name: X-Aed-Admin-Key
      description: 管理员登录后签发的 admin session key，适用于除 bootstrap / reset-super-admin 外的 /api/admin/* 端点
    legacyAdminKey:
      type: apiKey
      in: header
      name: X-Aed-Admin-Key
      description: 既有 AED_PUSH_ADMIN_KEY，仅用于 bootstrap、reset-super-admin 和兼容 ops/dev 入口

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    AdminSessionLimitReached:
      description: 管理员登录设备数已达到上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminSessionLimitReachedResponse'
    RateLimited:
      description: 操作频率限制
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'

  schemas:
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          description: 响应数据，具体结构由各接口定义；错误响应可省略，空成功响应可为 null

    AedReportRequest:
      type: object
      required: [type, description]
      properties:
        type:
          type: string
          enum: [damaged, relocated, unusable, other]
        description:
          type: string
        images:
          type: array
          items:
            type: string
        reporterSource:
          type: string
          enum: [login, guest]
        contactPhone:
          type: string
        contactEmail:
          type: string

    AedItem:
      type: object
      required:
        - id
        - name
        - lat
        - lng
        - status
        - image
        - address
        - lastMaintenance
        - nextMaintenance
        - maintainer
      properties:
        id:
          type: string
        name:
          type: string
        lat:
          type: number
        lng:
          type: number
        status:
          type: string
          enum: [online, offline]
        distance:
          type: number
        image:
          type: string
        address:
          type: string
        lastMaintenance:
          type: string
        nextMaintenance:
          type: string
        maintainer:
          type: string

    AedDetail:
      allOf:
        - $ref: '#/components/schemas/AedItem'

    CampusCode:
      type: string
      enum: [guilinyang, fucheng]

    RescuerAvailabilityStatus:
      type: string
      enum: [online, offline]

    RescuerSkillFlags:
      type: object
      required: [cpr, aed, stb]
      properties:
        cpr:
          type: boolean
        aed:
          type: boolean
        stb:
          type: boolean

    RescuerListItem:
      type: object
      required:
        - id
        - name
        - avatarUrl
        - campus
        - campusName
        - level
        - availabilityStatus
        - qualificationStatus
        - distance
        - phoneMasked
        - skills
      properties:
        id:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
        campus:
          $ref: '#/components/schemas/CampusCode'
        campusName:
          type: string
        level:
          type: string
          nullable: true
          enum: [honor, trainee, official, core]
        availabilityStatus:
          $ref: '#/components/schemas/RescuerAvailabilityStatus'
        qualificationStatus:
          type: string
          enum: [active, inactive]
        distance:
          type: number
        phoneMasked:
          type: string
        skills:
          $ref: '#/components/schemas/RescuerSkillFlags'

    RescuerListResponse:
      type: object
      required: [campus, campusName, viewerCampusDistance, autoOfflineRadius, items]
      properties:
        campus:
          $ref: '#/components/schemas/CampusCode'
        campusName:
          type: string
        viewerCampusDistance:
          type: number
        autoOfflineRadius:
          type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/RescuerListItem'

    RescuerDetail:
      type: object
      required:
        - id
        - name
        - avatarUrl
        - campus
        - campusName
        - level
        - availabilityStatus
        - qualificationStatus
        - phone
        - phoneMasked
        - skills
      properties:
        id:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
        campus:
          $ref: '#/components/schemas/CampusCode'
        campusName:
          type: string
        level:
          type: string
          nullable: true
          enum: [honor, trainee, official, core]
        availabilityStatus:
          $ref: '#/components/schemas/RescuerAvailabilityStatus'
        qualificationStatus:
          type: string
          enum: [active, inactive]
        phone:
          type: string
        phoneMasked:
          type: string
        certificateNoMasked:
          type: string
          nullable: true
        workUnit:
          type: string
          nullable: true
        skills:
          $ref: '#/components/schemas/RescuerSkillFlags'

    RescuerAvailabilitySetting:
      type: object
      required:
        - campus
        - campusName
        - availabilityStatus
        - autoOfflineRadius
        - maxManualOfflineHours
        - manualOfflineFrom
        - manualOfflineUntil
        - autoOfflineReason
      properties:
        campus:
          $ref: '#/components/schemas/CampusCode'
        campusName:
          type: string
        availabilityStatus:
          $ref: '#/components/schemas/RescuerAvailabilityStatus'
        autoOfflineRadius:
          type: number
        maxManualOfflineHours:
          type: number
        manualOfflineFrom:
          type: string
          format: date-time
          nullable: true
        manualOfflineUntil:
          type: string
          format: date-time
          nullable: true
        autoOfflineReason:
          type: string
          nullable: true
          enum: [out_of_service_radius]

    UpdateRescuerAvailabilityPayload:
      type: object
      required: [manualOfflineUntil]
      properties:
        manualOfflineUntil:
          type: string
          format: date-time
          nullable: true

    PublishHelpPayload:
      type: object
      required: [lat, lng, address, content, type]
      properties:
        lat:
          type: number
        lng:
          type: number
        address:
          type: string
        content:
          type: string
        type:
          type: string
          enum: [help_hand, call_120, call_school, general]
        images:
          type: array
          items:
            type: string
        requestChannel:
          type: string
          enum: [user, guest]
        guestName:
          type: string
        callbackAllowed:
          type: boolean
        privacyConsentAt:
          type: string
          format: date-time

    PublishHelpResponse:
      type: object
      required: [id, requestNo, status, createdAt]
      properties:
        id:
          type: string
        requestNo:
          type: string
        status:
          type: string
          enum: [published, responding, pending_review, closed, false_alarm]
        createdAt:
          type: string
          format: date-time
        followupCode:
          type: string
        closeToken:
          type: string

    HelpListItem:
      type: object
      required: [id, requestNo, content, type, status, address, createdAt, respondersCount, latestEta]
      properties:
        id:
          type: string
        requestNo:
          type: string
        content:
          type: string
        type:
          type: string
          enum: [help_hand, call_120, call_school, general]
        status:
          type: string
          enum: [published, responding, pending_review, closed, false_alarm]
        address:
          type: string
        createdAt:
          type: string
          format: date-time
        respondersCount:
          type: integer
        latestEta:
          type: string

    HelpListPage:
      type: object
      required: [items, total, page, pageSize, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HelpListItem'
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer

    HelpResponder:
      type: object
      required: [name, role, distance, estimatedArrivalTime]
      properties:
        name:

          minimum: -180
          maximum: 180
        reportedAt:
          type: string
          format: date-time

    RescueTiming:
      type: object
      description: 位置实时性阈值；必须满足 0 < signalLostAfterSeconds < locationGoneAfterSeconds，且 locationReportIntervalSeconds > 0
      required: [signalLostAfterSeconds, locationGoneAfterSeconds, locationReportIntervalSeconds]
      properties:
        signalLostAfterSeconds:
          type: integer
          minimum: 1
        locationGoneAfterSeconds:
          type: integer
          minimum: 1
        locationReportIntervalSeconds:
          type: integer
          minimum: 1


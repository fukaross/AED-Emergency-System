          nullable: true
        rescuerArchiveProfileId:
          type: string
        currentCertificateRecordId:
          type: string
          nullable: true
        responderType:
          type: string
          enum: [rescuer, duty_teacher]
        status:
          type: string
          enum: [active, inactive]
        level:
          type: string
          nullable: true
          enum: [honor, trainee, official, core]
        certified:
          type: boolean
        certExpiry:
          type: string
          nullable: true
        certExpired:
          type: boolean
        sourceType:
          type: string
          enum: [school_import]
        sourceBatchNo:
          type: string
          nullable: true
        remark:
          type: string
          nullable: true


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 小程序 opaque token（非 JWT），通过 Authorization Bearer 头传递
    adminSessionKey:
      type: apiKey
      in: header
      name: X-Aed-Admin-Key
      description: 管理员登录后签发的 admin session key，适用于除 bootstrap / reset-super-admin 外的 /api/admin/* 端点
    legacyAdminKey:
      type: apiKey
      in: header
      name: X-Aed-Admin-Key
      description: 既有 AED_PUSH_ADMIN_KEY，仅用于 bootstrap、reset-super-admin 和兼容 ops/dev 入口

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Unauthorized:
      description: 未登录或 Token 已过期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Forbidden:
      description: HTTP 403 / code 1003；业务权限不足，或 Admin 域的管理员账号已停用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    SmallProgramForbidden:
      description: HTTP 403；小程序业务权限不足（1003/1017）或当前账号已禁用（1018）
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [1003, 1017, 1018]
    AccountDisabled:
      description: HTTP 403 / code 1018；当前小程序账号已禁用，客户端必须终止本地认证
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [1018]
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Conflict:
      description: 资源状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    DuplicateHelpRequest:
      description: HTTP 409 / code 1009；当前身份已有进行中的求助
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    HelpAlreadyClosed:
      description: HTTP 409 / code 1014；求助已经关闭，不重复执行关闭副作用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    RescueSessionClosed:
      description: HTTP 409 / code 1016；急救会话已关闭，不允许继续读取或写入
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    AdminSessionLimitReached:
      description: 管理员登录设备数已达到上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminSessionLimitReachedResponse'
    AdminAlreadyInitialized:
      description: HTTP 409 / code 2019；超级管理员已经初始化
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - type: object
                properties:
                  code:
                    type: integer
                    enum: [2019]
    RateLimited:
      description: 操作频率限制
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    FeatureRequiresSqlite:
      description: 当前功能要求 SQLite 数据源
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'

  schemas:
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          description: 响应数据，具体结构由各接口定义；错误响应可省略，空成功响应可为 null

    AedReportRequest:
      type: object
      required: [type, description]
      properties:
        type:
          type: string
          enum: [damaged, relocated, unusable, other]
        description:
          type: string
        images:
          type: array

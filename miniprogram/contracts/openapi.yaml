openapi: '3.0.3'
info:
  title: AED 急救小程序 API
  version: '1.1.0'
  description: |
    REDACTED AED 急救小程序后端接口契约
    来源：CLAUDE.md §8 + BackEnd.md v1.2
  license:
    name: Proprietary
    url: https://www.qtnu.edu.cn

servers:
  - url: https://api.aed.qtnu.edu.cn
    description: 生产环境

paths:
  /api/aed/nearby:
    get:
      summary: 获取附近 AED 列表
      operationId: getNearbyAed
      security: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
        - name: radius
          in: query
          schema:
            type: number
            default: 3000
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AedItem'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/aed/{id}:
    get:
      summary: 获取单个 AED 详情
      operationId: getAedDetail
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AedDetail'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/aed/{id}/report:
    post:
      summary: 提交 AED 问题报告
      operationId: createAedReport
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AedReportRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/rescuers/nearby:
    get:
      summary: 获取当前校区附近急救员列表
      operationId: getNearbyRescuers
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
        - name: lng
          in: query
          required: true
          schema:
            type: number
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RescuerListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/rescuers/{id}:
    get:
      summary: 获取急救员联络详情
      operationId: getRescuerDetail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RescuerDetail'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/rescuers/me/availability:
    get:
      summary: 获取当前急救员自己的运行态配置
      operationId: getMyRescuerAvailability
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RescuerAvailabilitySetting'
        '400':
          $ref: '#/components/responses/BadRequest'
    put:
      summary: 设置当前急救员的限时离线窗口
      operationId: updateMyRescuerAvailability
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRescuerAvailabilityPayload'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RescuerAvailabilitySetting'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/help/request:
    post:
      summary: 发布求助需求
      description: >
        求助创建成功并进入 published 状态后，服务端应通过微信订阅消息通知校医室、
        发布者辅导员、附近有效急救员和值班老师；手动求助不通知家长/监护人。
      operationId: createHelpRequest
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishHelpPayload'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PublishHelpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/help/list:
    get:
      summary: 获取当前登录用户的求助历史
      operationId: listHelpRequests
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [published, responding, pending_review, closed, false_alarm]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HelpListPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/help/{id}:
    get:
      summary: 获取求助详情
      operationId: getHelpRequestDetail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HelpRequestDetail'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/help/{id}/report:
    post:
      summary: 提交救助报告
      operationId: submitHelpReport
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitHelpReportPayload'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubmitHelpReportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/help/guest/query:
    post:
      summary: 游客查询求助状态
      operationId: queryGuestHelp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestLookupPayload'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GuestHelpLookupResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/help/guest/close:
    post:
      summary: 游客关闭误报
      operationId: closeGuestHelp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestClosePayload'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GuestCloseResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/help/{id}/respond:
    post:
      summary: 响应求助
      operationId: respondToHelpRequest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RespondToHelpPayload'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/help/{id}/close:
    put:
      summary: 关闭求助或标记误报
      operationId: closeHelpRequest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseHelpPayload'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/courses:
    get:
      summary: 获取课程列表
      operationId: listCourses
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CourseListPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/courses/by-type:
    get:
      summary: 按类型获取预置课程
      operationId: getCourseByType
      security: []
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [cpr, aed, heimlich]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CourseByTypeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/courses/{id}:
    get:
      summary: 获取课程详情
      operationId: getCourseDetail
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CourseDetail'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/user/profile:
    get:
      summary: 获取用户信息
      operationId: getUserProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
    put:
      summary: 更新用户信息
      operationId: updateUserProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfilePayload'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/user/archives:
    get:
      summary: 获取急救档案列表
      operationId: listUserArchives
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: level
          in: query
          schema:
            type: string
            enum: [honor, trainee, official, core]
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ArchiveListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/user/archives/{id}:
    get:
      summary: 获取急救档案详情
      operationId: getArchiveDetail
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/RescuerArchiveDetail'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/user/archives/{id}/phone:
    get:
      summary: 获取档案完整电话号码
      operationId: getArchivePhone
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: purpose
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [phone]
                        properties:
                          phone:
                            type: string
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/user/volunteer-applications:
    post:
      summary: 提交校园 AED 急救志愿者入队申请
      operationId: createVolunteerApplication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolunteerApplicationPayload'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VolunteerApplicationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/vitals/current:
    get:
      summary: 获取当前生命体征
      operationId: getCurrentVitalSigns
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VitalSignsCurrent'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/vitals/heart-rate/trends:
    get:
      summary: 获取心率趋势
      operationId: listHeartRateTrends
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: intervalMinutes
          in: query
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HeartRateTrendList'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/vitals/alerts:
    post:
      summary: 上报生命体征告警候选事件
      operationId: createVitalAlert
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVitalAlertPayload'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/VitalAlertResult'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/knowledge/summary:
    get:
      summary: 获取课堂统计横幅数据
      operationId: getKnowledgeSummary
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KnowledgeSummary'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/banners:
    get:
      summary: 获取轮播横幅配置
      description: >
        历史运营配置接口，课堂首页首屏已改用 /api/knowledge/summary，
        小程序课堂页不再消费本接口。
      operationId: listBanners
      security: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BannerList'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/login:
    post:
      summary: 微信登录
      operationId: loginByWechatCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/refresh:
    post:
      summary: 刷新 Token
      operationId: refreshAuthToken
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/upload/image:
    post:
      summary: 上传图片
      operationId: uploadImage
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, scene]
              properties:
                file:
                  type: string
                  format: binary
                scene:
                  type: string
                  enum: [avatar, report, help, volunteer]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadImageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/ops/help-requests:
    get:
      summary: 运营端获取求助记录列表
      operationId: listOpsHelpRequests
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [published, responding, pending_review, closed, false_alarm]
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OpsHelpRequestListPage'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/ops/help-requests/{id}/close:
    put:
      summary: 运营端关闭求助或标记误报
      operationId: closeOpsHelpRequest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseHelpPayload'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/ops/aed/import:
    post:
      summary: 运营端批量导入 AED 点位
      operationId: importOpsAedDevices
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: 后端需按 BackEnd.md 将 WGS-84 转换为 GCJ-02 并双存。
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsAedImportRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OpsImportResult'
        '400':
